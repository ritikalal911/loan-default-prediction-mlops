name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test, Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -r requirements-dev.txt

      - name: Prepare model artifacts
        run: |
          mkdir -p models
          mkdir -p data/processed
          cp deployment_artifacts/model.joblib models/model.joblib
          cp deployment_artifacts/preprocessor.pkl data/processed/preprocessor.pkl

      - name: Lint with Ruff
        run: |
          ruff check app tests --output-format=github

      - name: Check formatting with Ruff
        run: |
          ruff format --check app tests

      - name: Run unit tests and data validation
        run: |
          python -m pytest tests -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t loan-default-api .